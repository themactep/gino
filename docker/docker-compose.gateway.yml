# ═══════════════════════════════════════════════════════
# Gino Gateway — Multi-Tenant Assistant Deployment
# ═══════════════════════════════════════════════════════
#
# This compose file deploys the Gino gateway container only.
# It expects an external Ollama instance for brain embeddings.
# Place this file alongside a .env with your credentials.
#
# Usage:
#   cp .env.gateway.example .env
#   # Edit .env with your API keys and Ollama URL
#   docker compose -f docker-compose.gateway.yml up -d
#

services:
  gino-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    image: gino:gateway
    container_name: gino-gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GINO_API_PORT:-8080}:8080"
    volumes:
      - ${GINO_DATA_PATH:-/opt/gino/gateway-data}:/home/gino/.gino
    networks:
      - gino-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  gino-net:
    driver: bridge
