name: Docker Build

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., v0.1.0) - leave empty to only push :latest'
        required: false
        type: string
      build_slim:
        description: 'Also build slim (no-Ollama) image'
        required: false
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: docker/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build Go binary (validation)
        run: go build ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Full image (with Ollama) ──────────────────────
      - name: Extract metadata for Docker (full)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: louisho5/gino
          tags: |
            type=raw,value=${{ inputs.version_tag }},enable=${{ inputs.version_tag != '' }}
            type=raw,value=latest

      - name: Build and push full image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Image digest (full)
        run: echo "Full image pushed with digest ${{ steps.build.outputs.digest }}"

      # ── Slim image (no Ollama) ────────────────────────
      - name: Extract metadata for Docker (slim)
        if: ${{ inputs.build_slim }}
        id: meta-slim
        uses: docker/metadata-action@v5
        with:
          images: louisho5/gino
          tags: |
            type=raw,value=${{ inputs.version_tag }}-slim,enable=${{ inputs.version_tag != '' }}
            type=raw,value=slim

      - name: Build and push slim image
        if: ${{ inputs.build_slim }}
        id: build-slim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.slim
          push: true
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Image digest (slim)
        if: ${{ inputs.build_slim }}
        run: echo "Slim image pushed with digest ${{ steps.build-slim.outputs.digest }}"
